# 03-fleet-audit.yml — read-only health sweep. The linuxplus audit-script
# habit at fleet scale. Run this FIRST (Phase 2), run it often; it changes
# nothing, so it needs no --check and carries no risk.
#   ansible-playbook -i ../inventory.ini 03-fleet-audit.yml
# Thresholds come from group_vars/all.yml.
---
- name: Fleet audit — changes nothing, reports everything
  hosts: fleet
  become: false
  gather_facts: true

  tasks:
    - name: Collect failed systemd units
      ansible.builtin.command: systemctl --failed --no-legend
      register: failed_units
      changed_when: false          # command module always reports changed; this is a read

    - name: Collect root filesystem usage
      ansible.builtin.command: df --output=pcent /
      register: root_df
      changed_when: false

    - name: Collect deleted-but-open space holders (week-10 reflex, fleet-wide)
      ansible.builtin.shell: lsof +L1 2>/dev/null | awk 'NR>1 && $7+0 > 104857600' | wc -l
      register: ghosts
      changed_when: false

    - name: Health report
      ansible.builtin.debug:
        msg:
          - "uptime: {{ (ansible_facts['uptime_seconds'] / 86400) | round(1) }} days"
          - "load1/core: {{ (ansible_facts['loadavg']['1m'] / ansible_facts['processor_vcpus']) | round(2) }} (max {{ audit_load_per_core_max }})"
          - "mem available: {{ ansible_facts['memory_mb']['nocache']['free'] }} MB of {{ ansible_facts['memtotal_mb'] }} MB"
          - "root fs: {{ root_df.stdout_lines[-1] | trim }} used (max {{ audit_disk_max_pcent }}%)"
          - "failed units: {{ failed_units.stdout_lines | length }}"
          - "deleted-open >100MB: {{ ghosts.stdout | trim }}"

    - name: FAIL the play if a host is unhealthy (assert = audit with teeth)
      ansible.builtin.assert:
        that:
          - failed_units.stdout_lines | length == 0
          - (root_df.stdout_lines[-1] | trim | replace('%','') | int) < audit_disk_max_pcent
          - (ansible_facts['loadavg']['1m'] / ansible_facts['processor_vcpus']) < audit_load_per_core_max
        fail_msg: >-
          {{ inventory_hostname }} failed one or more health assertions —
          scroll up to the Health report task for which, then diagnose on-host
          with the week-10 toolkit.
        success_msg: "{{ inventory_hostname }} healthy"
      # A red host here is a real finding, not a playbook bug. ignore_errors
      # is deliberately absent: one sick host should make the run loud.
