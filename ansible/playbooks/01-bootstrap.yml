# 01-bootstrap.yml — fleet baseline: packages + hygiene, both OS families.
# First real-change playbook. Order of operations (non-negotiable):
#   ansible-playbook -i ../inventory.ini 01-bootstrap.yml --check --diff --limit muddpi -K
#   ...read the diff, explain every line...
#   drop --check, run, then run AGAIN and confirm changed=0.
---
- name: Fleet baseline
  hosts: fleet
  become: true

  tasks:
    - name: Refresh package cache (Debian family)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600        # idempotency guard — no "changed" spam on every run
      when: ansible_facts['os_family'] == 'Debian'

    - name: Baseline packages present (Debian family)
      ansible.builtin.apt:
        name: "{{ baseline_packages }}"
        state: present
      when: ansible_facts['os_family'] == 'Debian'

    - name: Baseline packages present (RHEL family)
      ansible.builtin.dnf:
        name: "{{ baseline_packages }}"
        state: present
      when: ansible_facts['os_family'] == 'RedHat'

    # state: present, never latest — bootstrap declares "installed", not
    # "upgrade whenever this runs". Fleet updates deserve their own playbook
    # with serial: 1 and a decision about reboots (a Phase 5 project).

    - name: Timezone is consistent fleet-wide
      community.general.timezone:
        name: America/Denver

    - name: Drop a managed-by marker (visible proof on first login)
      ansible.builtin.copy:
        dest: /etc/motd.d/ansible-managed
        content: |
          This host is managed by Ansible from tp-mudd (homelab/ansible/).
          Hand-edits to managed config will be reverted on the next run.
        mode: "0644"
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Drop a managed-by marker (Debian has no motd.d on all versions)
      ansible.builtin.copy:
        dest: /etc/motd
        content: |
          This host is managed by Ansible from tp-mudd (homelab/ansible/).
          Hand-edits to managed config will be reverted on the next run.
        mode: "0644"
      when: ansible_facts['os_family'] == 'Debian'

    - name: Report what this host is
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }},
          {{ ansible_facts['os_family'] }} family,
          {{ ansible_facts['processor_vcpus'] }} vCPU,
          {{ (ansible_facts['memtotal_mb'] / 1024) | round(1) }} GB RAM
