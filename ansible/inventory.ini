# Fleet inventory — SSH over Tailscale (MagicDNS names)
# Control node: tp-mudd (tag:t0 — full access to all tiers; not listed here).
# ansible_user: SET PER HOST before Phase 1 — these are placeholders matching
# the account you actually SSH in as today. Wrong user reads as "unreachable".

[tier1]
dell-ubuntu   ansible_user=dillon
dell-fedora   ansible_user=dillon

[tier2]
muddpi        ansible_user=dillon

[tier3]
pi-zero       ansible_user=dillon

[cloud]
mudd-cloud    ansible_user=ubuntu

# ── OS family groups — package manager and firewall tooling split here ──────
# Raspberry Pi OS and Ubuntu are both Debian-family: apt + ufw.
# Only dell-fedora is RHEL-family: dnf + firewalld + SELinux.

[debian_family]
dell-ubuntu
muddpi
pi-zero
mudd-cloud

[rhel_family]
dell-fedora

# ── Umbrella group ───────────────────────────────────────────────────────────

[fleet:children]
tier1
tier2
tier3
cloud

# ── Blast-radius notes (read before every --limit decision) ──────────────────
# muddpi      first-run target: real OS, lowest stakes, backup exit node only
# pi-zero     tiny + slow; expect long gather_facts, raise timeout if needed
# dell-ubuntu hosts Gitea (port 3000) — never first-run here
# dell-fedora KVM guest + SELinux enforcing + n8n — the "different" host
# mudd-cloud  PRODUCTION exit node — last to receive anything, always
